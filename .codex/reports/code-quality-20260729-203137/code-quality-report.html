a.dimensions.forEach(d=>{const row=el('div',undefined,'dimension'),head=el('div'),name=el('strong',d.name);
head.append(name,el('div',`${d.confidence||'unknown'} confidence`,'subtle'));const mid=el('div');
const summary=el('div',d.summary||'');mid.append(summary);if(d.status==='assessed'){const bar=el('div',undefined,'bar'),fill=el('i');
fill.style.width=`${d.score*20}%`;bar.append(fill);mid.append(bar)}const value=el('strong',d.status==='assessed'?`${d.score}/5`:'—');
row.append(head,mid,value);$('dimensions').append(row)});
const findings=a.findings||[],filterRoot=$('filters');['all','critical','high','medium','low','info'].forEach((s,i)=>{
const b=el('button',`${s} (${s==='all'?findings.length:findings.filter(f=>f.severity===s).length})`);if(i===0)b.classList.add('active');
b.onclick=()=>{[...filterRoot.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');drawFindings(s)};filterRoot.append(b)});
function drawFindings(filter){const root=$('findings');root.replaceChildren();const rows=findings.filter(f=>filter==='all'||f.severity===filter);
rows.forEach(f=>{const box=el('article',undefined,'finding'),head=el('div',undefined,'finding-head');
head.append(el('strong',`${f.id} · ${f.title}`),el('span',f.severity,`badge sev-${f.severity}`),
el('span',`${f.confidence} confidence`,'subtle'));box.append(head);
if(f.file)box.append(el('div',`${f.file}${f.line?':'+f.line:''}`,'subtle'));
[['Evidence',f.evidence],['Impact',f.impact],['Recommendation',f.recommendation]].forEach(([k,v])=>{
if(v){const para=el('p');para.append(el('strong',k+': '),document.createTextNode(v));box.append(para)}});root.append(box)});
if(!rows.length)root.append(el('p','No findings in this category.','empty'))}drawFindings('all');
const checks=$('checks');(a.checks||[]).forEach(x=>{const row=el('p');row.append(el('span',x.status,'badge'),document.createTextNode(
` ${x.command} — ${x.summary||''}`));checks.append(row)});if(!a.checks?.length)checks.append(el('p','No checks recorded.','empty'));
(a.priorities||[]).forEach(x=>{const block=el('div');block.append(el('h3',x.horizon));const ul=el('ul');(x.items||[]).forEach(i=>ul.append(el('li',i)));
block.append(ul);$('priorities').append(block)});
const totals=m.totals||{},bands=m.size_bands||{};$('metrics').append(el('p',
`${totals.files??'—'} files · ${totals.lines??'—'} physical lines · ${totals.test_files??'—'} test files`));
const table=el('table');table.innerHTML='<thead><tr><th>File-size band</th><th>Files</th></tr></thead>';
const tbody=el('tbody');Object.entries(bands).forEach(([k,v])=>{const tr=el('tr');tr.append(el('td',k.replaceAll('_',' ')),el('td',v));tbody.append(tr)});
table.append(tbody);$('metrics').append(table);
</script></body></html>
