name: ci

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# go-sqlite3 ships a cgo-backed implementation and a !cgo static mock that
# omits sqlite3.Error / sqlite3.ErrConstraintUnique. Pin CGO_ENABLED=1 so every
# Go step (vet, staticcheck, test, build, generate, race, e2e) uses the real
# driver regardless of the runner image's default, matching the production
# Dockerfile build.
env:
  CGO_ENABLED: "1"

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pin both Node and its bundled npm. Floating sudo-npm was part of
          # the executable-substitution surface identified in #338.
          node-version: "22.14.0"
          cache: pnpm
          cache-dependency-path: web/dashboard/pnpm-lock.yaml

      - name: Build dashboard assets
        working-directory: web/dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
          test -f ../../internal/dashboard/assets/.production
          test -f ../../internal/dashboard/assets/index.html

      - name: Test Hermes/Devin helpers
        run: python3 -m unittest discover -s tools/hermes-devin -p 'test_*.py'

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'These files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Lint
        run: go vet ./...

      - name: Reject production-unreachable code
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 -tests=false -checks='U1000,SA1006,SA4004,SA4006' ./...

      - name: Reject committed binaries
        run: go run ./tools/check-binaries

      - name: Install process sandbox runtime
        run: |
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "10.9.2"
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          # Install with the pinned unprivileged npm into staging. Root only
          # copies the reviewed result and seals its executable closure; npm
          # itself never runs under sudo. RUNNER_TEMP is intentionally
          # user-writable, proving trust no longer depends on ancestor modes.
          srt_stage="$RUNNER_TEMP/looper-srt-stage"
          srt_prefix="$RUNNER_TEMP/looper-srt-runtime"
          srt_tools="$RUNNER_TEMP/looper-srt-tools"
          npm install --global --prefix "$srt_stage" @anthropic-ai/sandbox-runtime@0.0.67
          sudo install -d -m 0755 "$srt_prefix" "$srt_tools"
          sudo cp -R "$srt_stage/." "$srt_prefix/"
          sudo chown -R root:root "$srt_prefix" "$srt_tools"
          sudo chmod -R go-w "$srt_prefix" "$srt_tools"
          sudo install -m 0555 "$(command -v node)" "$srt_tools/node"
          sudo ln -s ../looper-srt-runtime/bin/srt "$srt_tools/srt"

          go build -o "$RUNNER_TEMP/looper-srt-seal" ./cmd/looper-srt-seal
          sudo "$RUNNER_TEMP/looper-srt-seal" \
            --manifest "$srt_prefix/.looper-srt-trust.json" \
            --package-root "$srt_prefix/lib/node_modules" \
            --srt "$srt_tools/srt" \
            --node "$srt_tools/node" \
            --rg "$(command -v rg)" \
            --bwrap "$(command -v bwrap)" \
            --socat "$(command -v socat)"
          echo "$srt_tools" >> "$GITHUB_PATH"

      # The /api/v1 compat artifacts are generated from the Go handlers. Catch a
      # response-shape change that forgot to regenerate here, with the command
      # to run, instead of as a fixture mismatch deep in a table test.
      #
      # This runs BEFORE `go test ./...` on purpose: the frozen-artifact table
      # tests in internal/api compare live handler responses against these same
      # files, so a stale artifact fails them first and the job would end
      # without ever printing the regeneration command.
      #
      # CI checks out a clean tree, so "did generation change anything" and
      # "does the tree still match HEAD" are the same question here and the
      # git diff is the cheaper of the two. scripts/verify.sh runs against a
      # dirty working tree and deliberately uses before/after digests instead.
      - name: Check frozen HTTP contract artifacts are current
        run: |
          go generate ./internal/api/...
          if ! git diff --exit-code -- internal/api/testdata/contracts/; then
            printf '\nThe frozen /api/v1 compat artifacts are stale. Regenerate them in this commit:\n\n  go generate ./internal/api/...\n\n' >&2
            exit 1
          fi

      - name: Test
        env:
          LOOPER_REQUIRE_TRUSTED_SRT: "1"
        run: go test ./...

      - name: Build
        env:
          LOOPER_BUILD_GIT_SHA: ${{ github.sha }}
        run: |
          looper_build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export LOOPER_BUILD_TIMESTAMP="$looper_build_timestamp"
          go build -ldflags "$(go run ./tools/go-build-flags)" ./...

  # AGENTS.md requires a semantic prefix (feat/fix/docs/test/refactor/chore/ci)
  # on every PR title and commit subject. This is a deterministic, regex-
  # checkable rule, so it is enforced here instead of by an LLM reviewer —
  # instant, consistent feedback that frees review rounds for the design-
  # guideline checks that genuinely need contextual judgment. See #470.
  #
  # Mergify merges (not squashes) into main (.mergify.yml), so every non-merge
  # commit subject in the PR range lands on main verbatim and is checked here.
  # Merge commits are skipped: their "Merge branch ..." subjects are not
  # authored semantic messages.
  semantic-prefix:
    if: github.event_name == 'pull_request'
    name: Semantic prefix
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the base..HEAD range and its merge-base resolve.
          fetch-depth: 0
          # The job runs pull-request-controlled shell scripts; do not leave a
          # write-capable token on disk for them to access.
          persist-credentials: false

      - name: Test the semantic-prefix validator
        run: scripts/check-semantic-prefix.test.sh

      - name: Validate PR title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scripts/check-semantic-prefix.sh -- "$PR_TITLE"
          git log --no-merges --format=%s "${BASE_SHA}..HEAD" \
            | scripts/check-semantic-prefix.sh --stdin

  race:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Race detector (focused)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run focused race-detector tests
        # Package set lives in scripts/race-packages.txt so this job and
        # scripts/verify.sh cannot drift apart.
        run: grep -v '^#' scripts/race-packages.txt | grep . | xargs go test -race -count=1

  detect-e2e-changes:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Detect E2E change scope
    runs-on: ubuntu-latest
    outputs:
      all_e2e: ${{ steps.outputs.outputs.all_e2e }}
      daemon_boot: ${{ steps.outputs.outputs.daemon_boot }}
      github_contract: ${{ steps.outputs.outputs.github_contract }}
      resolve_comments: ${{ steps.outputs.outputs.resolve_comments }}
      worktree_invariants: ${{ steps.outputs.outputs.worktree_invariants }}

    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Detect changed files
        if: github.event_name == 'pull_request'
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@v3
        with:
          filters: |
            all_e2e:
              - 'go.mod'
              - 'go.sum'
              - 'internal/e2e/harness/**'
              - 'internal/e2e/*.go'
            daemon_boot:
              - 'cmd/**'
              - 'internal/bootstrap/**'
              - 'internal/config/**'
              - 'internal/runtime/**'
              - 'internal/e2e/smoke_daemon_test.go'
            github_contract:
              - 'internal/infra/github/**'
              - 'internal/e2e/githubcontract/**'
              - 'scripts/refresh-gh-fixtures.sh'
            resolve_comments:
              - 'internal/worker/**'
              - 'internal/fixer/**'
              - 'internal/reviewer/**'
              - 'internal/api/**'
              - 'internal/worktree*/**'
              - 'internal/e2e/resolve_comments_scenarios_test.go'
            worktree_invariants:
              - 'internal/worker/**'
              - 'internal/fixer/**'
              - 'internal/reviewer/**'
              - 'internal/api/**'
              - 'internal/infra/git/**'
              - 'internal/worktree*/**'
              - 'internal/e2e/invariant_worktree_test.go'

      - name: Resolve E2E job outputs
        id: outputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          ALL_E2E: ${{ steps.filter.outputs.all_e2e }}
          DAEMON_BOOT: ${{ steps.filter.outputs.daemon_boot }}
          GITHUB_CONTRACT: ${{ steps.filter.outputs.github_contract }}
          RESOLVE_COMMENTS: ${{ steps.filter.outputs.resolve_comments }}
          WORKTREE_INVARIANTS: ${{ steps.filter.outputs.worktree_invariants }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            all=true
            daemon=true
            github=true
            resolve=true
            worktree=true
          elif [ "$FILTER_OUTCOME" != "success" ] || [ "$ALL_E2E" = "true" ]; then
            all=true
            daemon=true
            github=true
            resolve=true
            worktree=true
          else
            all=false
            daemon="${DAEMON_BOOT:-false}"
            github="${GITHUB_CONTRACT:-false}"
            resolve="${RESOLVE_COMMENTS:-false}"
            worktree="${WORKTREE_INVARIANTS:-false}"
          fi

          {
            echo "all_e2e=$all"
            echo "daemon_boot=$daemon"
            echo "github_contract=$github"
            echo "resolve_comments=$resolve"
            echo "worktree_invariants=$worktree"
          } >> "$GITHUB_OUTPUT"

  contract-invariant-integration-smoke:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Contract/invariant integration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run contract/invariant smoke
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/contract-invariant-integration-smoke
        run: go test ./internal/e2e -run 'TestSmokeLooperdBoots|TestSmokeLooperdFailsFast|TestSmokeLooperdExits' -timeout 4m -count=1 && go test ./internal/e2e/githubcontract -run 'TestInvariantGatewayUsesSupportedGHJSONFields|TestRegressionPR261FallsBackToIssueDetailForPRAuthorAssociation|TestFakeGHFixtureRejectsUnsupportedJSONField' -timeout 4m -count=1

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-invariant-integration-smoke-artifacts
          path: ${{ runner.temp }}/looper-e2e/contract-invariant-integration-smoke
          if-no-files-found: ignore

  daemon-boot-e2e:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Daemon boot E2E
    needs: detect-e2e-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: needs.detect-e2e-changes.outputs.daemon_boot == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run daemon boot smoke E2E
        if: needs.detect-e2e-changes.outputs.daemon_boot == 'true'
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/daemon-boot-e2e
        run: go test ./internal/e2e -run 'TestSmokeLooperdBoots|TestSmokeLooperdFailsFast|TestSmokeLooperdExits' -timeout 8m -count=1

      - name: Upload daemon boot artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-boot-e2e-artifacts
          path: ${{ runner.temp }}/looper-e2e/daemon-boot-e2e
          if-no-files-found: ignore

  github-contract-e2e:
    if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.detect-e2e-changes.outputs.github_contract == 'true'
    name: GitHub contract E2E
    needs: detect-e2e-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: needs.detect-e2e-changes.outputs.github_contract == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GitHub contract E2E
        if: needs.detect-e2e-changes.outputs.github_contract == 'true'
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/github-contract-e2e
        run: go test ./internal/e2e/githubcontract -timeout 8m -count=1

      - name: Upload GitHub contract artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: github-contract-e2e-artifacts
          path: ${{ runner.temp }}/looper-e2e/github-contract-e2e
          if-no-files-found: ignore

  resolve-comments-e2e:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Resolve-comments E2E
    needs: detect-e2e-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: needs.detect-e2e-changes.outputs.resolve_comments == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run resolve-comments E2E
        if: needs.detect-e2e-changes.outputs.resolve_comments == 'true'
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/resolve-comments-e2e
        run: go test ./internal/e2e -run 'TestScenarioResolveComments' -timeout 8m -count=1

      - name: Upload resolve-comments artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resolve-comments-e2e-artifacts
          path: ${{ runner.temp }}/looper-e2e/resolve-comments-e2e
          if-no-files-found: ignore

  worktree-invariants-e2e:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Worktree invariants E2E
    needs: detect-e2e-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: needs.detect-e2e-changes.outputs.worktree_invariants == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run worktree invariants E2E
        if: needs.detect-e2e-changes.outputs.worktree_invariants == 'true'
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/worktree-invariants-e2e
        run: go test ./internal/e2e -run 'TestInvariantWorker' -timeout 8m -count=1

      - name: Upload worktree artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worktree-invariants-e2e-artifacts
          path: ${{ runner.temp }}/looper-e2e/worktree-invariants-e2e
          if-no-files-found: ignore
