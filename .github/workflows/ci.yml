name: ci

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/dashboard/pnpm-lock.yaml

      - name: Build dashboard assets
        working-directory: web/dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
          test -f ../../internal/dashboard/assets/.production
          test -f ../../internal/dashboard/assets/index.html

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'These files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Lint
        run: go vet ./...

      - name: Reject production-unreachable code
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 -tests=false -checks='U1000,SA1006,SA4004,SA4006' ./...

      - name: Reject committed binaries
        run: go run ./tools/check-binaries

      # The srt trust probe rejects the runtime when any path in or above
      # the installation is writable by the daemon user. Hosted-runner
      # images vary: some ship /usr/local and /usr/local/lib writable by
      # the runner account, via ownership or ACLs, and a default ACL on
      # /usr/local/lib would propagate runner-writable entries into
      # anything installed under it. Rather than hope for a clean image,
      # every run first RECREATES the hostile conditions (runner
      # ownership plus a default ACL granting the runner write), so the
      # hardening below is exercised deterministically on every image and
      # a regression fails this step on every run instead of only on
      # whichever image the pool happens to serve.
      - name: Simulate hostile runner image
        run: |
          sudo chown "$(id -u):$(id -g)" /usr/local/lib
          sudo setfacl -m "d:u:$(id -un):rwx" -m "u:$(id -un):rwx" /usr/local/lib

      # Harden BEFORE installing so nothing installed can inherit a
      # default ACL: pin the ancestor chain root-owned, 0755, and strip
      # both access and default ACL entries (-b alone leaves default
      # entries in place on some acl builds; -k removes them explicitly).
      # The chain runs all the way to / because the probe walks every
      # ancestor and image variance has been observed as high as /usr
      # (PR #318's verify run failed on "/usr is writable").
      - name: Harden sandbox runtime ancestors
        run: |
          sudo chown root:root / /usr /usr/local /usr/local/lib
          sudo chmod 0755 / /usr /usr/local /usr/local/lib
          sudo setfacl -b -k / /usr /usr/local /usr/local/lib

      - name: Install process sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo npm install --global --prefix /usr/local/lib/looper-srt-runtime @anthropic-ai/sandbox-runtime@0.0.67
          sudo install -d -m 0555 /usr/local/lib/looper-srt-tools
          sudo install -m 0555 "$(command -v node)" /usr/local/lib/looper-srt-tools/node
          sudo ln -s ../looper-srt-runtime/bin/srt /usr/local/lib/looper-srt-tools/srt
          echo /usr/local/lib/looper-srt-tools >> "$GITHUB_PATH"

      # Belt-and-braces sweep of the installed trees, then assert the
      # probe's own criterion — access(W_OK) as the runner user — over
      # the full chain. find -writable uses the same access(2) check the
      # Go probe uses, so this fails the job at setup time with the
      # offending paths listed, instead of surfacing later as
      # intermittent test failures.
      - name: Verify sandbox runtime is unwritable by the daemon user
        run: |
          sudo chmod -R go-w /usr/local/lib/looper-srt-runtime /usr/local/lib/looper-srt-tools
          sudo setfacl -R -b -k /usr/local/lib/looper-srt-runtime /usr/local/lib/looper-srt-tools
          writable="$(find / /usr /usr/local /usr/local/lib -maxdepth 0 -writable; find /usr/local/lib/looper-srt-runtime /usr/local/lib/looper-srt-tools -writable)"
          if [ -n "$writable" ]; then
            printf 'srt paths still writable by the daemon user:\n%s\n' "$writable"
            exit 1
          fi

      - name: Test
        env:
          LOOPER_REQUIRE_TRUSTED_SRT: "1"
        run: go test ./...

      - name: Build
        env:
          LOOPER_BUILD_GIT_SHA: ${{ github.sha }}
        run: |
          looper_build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export LOOPER_BUILD_TIMESTAMP="$looper_build_timestamp"
          go build -ldflags "$(go run ./tools/go-build-flags)" ./...

  race:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Race detector (focused)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run focused race-detector tests
        # Package set lives in scripts/race-packages.txt so this job and
        # scripts/verify.sh cannot drift apart.
        run: grep -v '^#' scripts/race-packages.txt | grep . | xargs go test -race -count=1

  detect-e2e-changes:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Detect E2E change scope
    runs-on: ubuntu-latest
    outputs:
      all_e2e: ${{ steps.outputs.outputs.all_e2e }}
      daemon_boot: ${{ steps.outputs.outputs.daemon_boot }}
      github_contract: ${{ steps.outputs.outputs.github_contract }}
      resolve_comments: ${{ steps.outputs.outputs.resolve_comments }}
      worktree_invariants: ${{ steps.outputs.outputs.worktree_invariants }}

    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Detect changed files
        if: github.event_name == 'pull_request'
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@v3
        with:
          filters: |
            all_e2e:
              - 'go.mod'
              - 'go.sum'
              - 'internal/e2e/harness/**'
              - 'internal/e2e/*.go'
            daemon_boot:
              - 'cmd/**'
              - 'internal/bootstrap/**'
              - 'internal/config/**'
              - 'internal/runtime/**'
              - 'internal/e2e/smoke_daemon_test.go'
            github_contract:
              - 'internal/infra/github/**'
              - 'internal/e2e/githubcontract/**'
              - 'scripts/refresh-gh-fixtures.sh'
            resolve_comments:
              - 'internal/worker/**'
              - 'internal/fixer/**'
              - 'internal/reviewer/**'
              - 'internal/api/**'
              - 'internal/worktree*/**'
              - 'internal/e2e/resolve_comments_scenarios_test.go'
            worktree_invariants:
              - 'internal/worker/**'
              - 'internal/fixer/**'
              - 'internal/reviewer/**'
              - 'internal/api/**'
              - 'internal/infra/git/**'
              - 'internal/worktree*/**'
              - 'internal/e2e/invariant_worktree_test.go'

      - name: Resolve E2E job outputs
        id: outputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          ALL_E2E: ${{ steps.filter.outputs.all_e2e }}
          DAEMON_BOOT: ${{ steps.filter.outputs.daemon_boot }}
          GITHUB_CONTRACT: ${{ steps.filter.outputs.github_contract }}
          RESOLVE_COMMENTS: ${{ steps.filter.outputs.resolve_comments }}
          WORKTREE_INVARIANTS: ${{ steps.filter.outputs.worktree_invariants }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            all=true
            daemon=true
            github=true
            resolve=true
            worktree=true
          elif [ "$FILTER_OUTCOME" != "success" ] || [ "$ALL_E2E" = "true" ]; then
            all=true
            daemon=true
            github=true
            resolve=true
            worktree=true
          else
            all=false
            daemon="${DAEMON_BOOT:-false}"
            github="${GITHUB_CONTRACT:-false}"
            resolve="${RESOLVE_COMMENTS:-false}"
            worktree="${WORKTREE_INVARIANTS:-false}"
          fi

          {
            echo "all_e2e=$all"
            echo "daemon_boot=$daemon"
            echo "github_contract=$github"
            echo "resolve_comments=$resolve"
            echo "worktree_invariants=$worktree"
          } >> "$GITHUB_OUTPUT"

  contract-invariant-integration-smoke:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Contract/invariant integration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run contract/invariant smoke
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/contract-invariant-integration-smoke
        run: go test ./internal/e2e -run 'TestSmokeLooperdBoots|TestSmokeLooperdFailsFast' -count=1 && go test ./internal/e2e/githubcontract -run 'TestInvariantGatewayUsesSupportedGHJSONFields|TestRegressionPR261FallsBackToIssueDetailForPRAuthorAssociation|TestFakeGHFixtureRejectsUnsupportedJSONField' -count=1

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-invariant-integration-smoke-artifacts
          path: ${{ runner.temp }}/looper-e2e/contract-invariant-integration-smoke
          if-no-files-found: ignore

  daemon-boot-e2e:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Daemon boot E2E
    needs: detect-e2e-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: needs.detect-e2e-changes.outputs.daemon_boot == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run daemon boot smoke E2E
        if: needs.detect-e2e-changes.outputs.daemon_boot == 'true'
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/daemon-boot-e2e
        run: go test ./internal/e2e -run 'TestSmokeLooperdBoots|TestSmokeLooperdFailsFast' -count=1

      - name: Upload daemon boot artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-boot-e2e-artifacts
          path: ${{ runner.temp }}/looper-e2e/daemon-boot-e2e
          if-no-files-found: ignore

  github-contract-e2e:
    if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.detect-e2e-changes.outputs.github_contract == 'true'
    name: GitHub contract E2E
    needs: detect-e2e-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: needs.detect-e2e-changes.outputs.github_contract == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GitHub contract E2E
        if: needs.detect-e2e-changes.outputs.github_contract == 'true'
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/github-contract-e2e
        run: go test ./internal/e2e/githubcontract -count=1

      - name: Upload GitHub contract artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: github-contract-e2e-artifacts
          path: ${{ runner.temp }}/looper-e2e/github-contract-e2e
          if-no-files-found: ignore

  resolve-comments-e2e:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Resolve-comments E2E
    needs: detect-e2e-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: needs.detect-e2e-changes.outputs.resolve_comments == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run resolve-comments E2E
        if: needs.detect-e2e-changes.outputs.resolve_comments == 'true'
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/resolve-comments-e2e
        run: go test ./internal/e2e -run 'TestScenarioResolveComments' -count=1

      - name: Upload resolve-comments artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resolve-comments-e2e-artifacts
          path: ${{ runner.temp }}/looper-e2e/resolve-comments-e2e
          if-no-files-found: ignore

  worktree-invariants-e2e:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Worktree invariants E2E
    needs: detect-e2e-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: needs.detect-e2e-changes.outputs.worktree_invariants == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run worktree invariants E2E
        if: needs.detect-e2e-changes.outputs.worktree_invariants == 'true'
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/worktree-invariants-e2e
        run: go test ./internal/e2e -run 'TestInvariantWorker' -count=1

      - name: Upload worktree artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worktree-invariants-e2e-artifacts
          path: ${{ runner.temp }}/looper-e2e/worktree-invariants-e2e
          if-no-files-found: ignore
